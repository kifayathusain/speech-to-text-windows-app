[tool.ruff]
target-version = "py310"
line-length = 88
include = ["*.py", "*.pyi", "*.ipynb", "**/pyproject.toml"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
    "integration: requires external services or executables such as FFmpeg",
    "real_model: requires installed voice models and actual inference",
]
